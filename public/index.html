<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازار بزرگ بین‌المللی شاهکار | Shahkar Global AI Marketplace</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              800: '#115e59',
              900: '#134e4a',
            },
            gold: {
              300: '#fde047',
              400: '#facc15',
              500: '#eab308',
              600: '#ca8a04',
            },
            obsidian: {
              800: '#0f172a',
              900: '#0b0f19',
              950: '#05070d',
            }
          },
          fontFamily: {
            persian: ['Vazirmatn', 'Tahoma', 'sans-serif'],
            latin: ['Outfit', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Vazirmatn for Persian & Outfit for English -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Three.js for 3D WebGL Product Stage -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #05070d;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    
    .latin-font {
      font-family: 'Outfit', sans-serif;
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(20, 30, 50, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      background: rgba(30, 45, 75, 0.6);
      border-color: rgba(45, 212, 191, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px -8px rgba(13, 148, 136, 0.25);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cyan-glow {
      box-shadow: 0 0 25px rgba(20, 184, 166, 0.3);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0d9488;
    }
  </style>

  <!-- React Importmap -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo, useRef, useCallback } from "react";
    import { createRoot } from "react-dom/client";

    // Helper functions
    const formatTomans = (num, lang = 'fa') => {
      if (!num) return '۰ تومان';
      const formatted = num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, "٫");
      if (lang === 'fa') {
        const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
        const faNum = formatted.replace(/[0-9]/g, w => persianDigits[parseInt(w)]);
        return `${faNum} تومان`;
      }
      return `${formatted} Tomans (~$${(num / 600000).toFixed(1)} USD)`;
    };

    const toPersianDigits = (str) => {
      if (str === null || str === undefined) return '';
      const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return str.toString().replace(/[0-9]/g, w => persianDigits[parseInt(w)]);
    };

    // --- 3D THREE.JS CANVAS COMPONENT ---
    const Three3DViewer = ({ modelType = 'watch', isInteractive = true }) => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth || 300;
        const height = container.clientHeight || 280;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0x2dd4bf, 2.5);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xeab308, 2.0);
        dirLight2.position.set(-5, -5, -2);
        scene.add(dirLight2);

        // Create 3D Mesh based on modelType
        const group = new THREE.Group();

        if (modelType === 'watch') {
          // Luxury Tourbillon Watch model primitive
          const ringGeo = new THREE.TorusGeometry(1.2, 0.18, 16, 100);
          const goldMat = new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.9, roughness: 0.1 });
          const ring = new THREE.Mesh(ringGeo, goldMat);
          group.add(ring);

          const dialGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.1, 32);
          const dialMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
          const dial = new THREE.Mesh(dialGeo, dialMat);
          dial.rotation.x = Math.PI / 2;
          group.add(dial);

          const handGeo = new THREE.BoxGeometry(0.06, 0.7, 0.02);
          const handMat = new THREE.MeshStandardMaterial({ color: 0x2dd4bf, emissive: 0x14b8a6 });
          const hand = new THREE.Mesh(handGeo, handMat);
          hand.position.y = 0.25;
          group.add(hand);
        } else if (modelType === 'headphones') {
          // Spatial ANC Headphones
          const arcGeo = new THREE.TorusGeometry(1.3, 0.08, 16, 50, Math.PI);
          const arcMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
          const arc = new THREE.Mesh(arcGeo, arcMat);
          arc.rotation.x = Math.PI / 2;
          group.add(arc);

          const cupGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 32);
          const cupMat = new THREE.MeshStandardMaterial({ color: 0x0d9488, metalness: 0.7, roughness: 0.2 });
          const cupL = new THREE.Mesh(cupGeo, cupMat);
          cupL.position.set(-1.3, 0, 0);
          cupL.rotation.z = Math.PI / 2;

          const cupR = cupL.clone();
          cupR.position.set(1.3, 0, 0);

          group.add(cupL);
          group.add(cupR);
        } else if (modelType === 'carpet') {
          // Persian Silk Carpet 3D stage
          const sheetGeo = new THREE.PlaneGeometry(2.4, 3.2, 32, 32);
          const mat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.8, side: THREE.DoubleSide });
          const carpet = new THREE.Mesh(sheetGeo, mat);
          carpet.rotation.x = -Math.PI / 4;
          group.add(carpet);
        } else if (modelType === 'glasses') {
          // AR Glasses
          const frameGeo = new THREE.TorusGeometry(0.6, 0.06, 16, 50);
          const mat = new THREE.MeshStandardMaterial({ color: 0x2dd4bf, metalness: 0.9, roughness: 0.1 });
          const glassL = new THREE.Mesh(frameGeo, mat);
          glassL.position.x = -0.7;
          const glassR = new THREE.Mesh(frameGeo, mat);
          glassR.position.x = 0.7;

          const bridgeGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 16);
          const bridge = new THREE.Mesh(bridgeGeo, mat);
          bridge.rotation.z = Math.PI / 2;

          group.add(glassL);
          group.add(glassR);
          group.add(bridge);
        } else if (modelType === 'appliance') {
          // Espresso Machine
          const bodyGeo = new THREE.BoxGeometry(1.6, 1.8, 1.2);
          const bodyMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
          const body = new THREE.Mesh(bodyGeo, bodyMat);
          group.add(body);
        } else {
          // Default Crystal Jewel Icosahedron
          const geo = new THREE.IcosahedronGeometry(1.2, 1);
          const mat = new THREE.MeshStandardMaterial({ color: 0x2dd4bf, wireframe: true });
          const mesh = new THREE.Mesh(geo, mat);
          group.add(mesh);
        }

        scene.add(group);

        // Animation loop
        let animationFrameId;
        let mouseX = 0, mouseY = 0;

        const onMouseMove = (e) => {
          if (!isInteractive) return;
          const rect = container.getBoundingClientRect();
          mouseX = ((e.clientX - rect.left) / width) * 2 - 1;
          mouseY = -((e.clientY - rect.top) / height) * 2 + 1;
        };

        if (isInteractive) {
          container.addEventListener('mousemove', onMouseMove);
        }

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          group.rotation.y += 0.008;
          group.rotation.x += (mouseY * 0.5 - group.rotation.x) * 0.05;
          group.rotation.z += (mouseX * 0.5 - group.rotation.z) * 0.05;

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          if (isInteractive) container.removeEventListener('mousemove', onMouseMove);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [modelType, isInteractive]);

      return (
        <div className="relative w-full h-full min-h-[260px] flex items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-b from-slate-900/40 to-slate-950/80 border border-slate-800/50">
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
          <div className="absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full text-[10px] text-teal-400 font-mono flex items-center gap-1.5 border border-teal-500/20">
            <span className="w-2 h-2 rounded-full bg-teal-400 animate-ping"></span>
            3D Interactive Stage • WebGL Active
          </div>
        </div>
      );
    };

    // --- MAIN APP CONTAINER ---
    const App = () => {
      // Global States
      const [lang, setLang] = useState('fa'); // 'fa' | 'en'
      const [dir, setDir] = useState('rtl');
      const [currency, setCurrency] = useState('TOMAN'); // 'TOMAN' | 'USD'
      const [currentRoute, setCurrentRoute] = useState('home'); // home, catalog, product-detail, cart, checkout, orders, vendor-dashboard, vendor-store, wishlist, analytics
      const [selectedProductId, setSelectedProductId] = useState('prd_1');
      const [selectedVendorId, setSelectedVendorId] = useState('vnd_1');

      // Data States from API
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [vendors, setVendors] = useState([]);
      const [loading, setLoading] = useState(true);

      // Cart & Wishlist States
      const [cart, setCart] = useState([
        { productId: 'prd_1', variantId: 'prd_1_v1', quantity: 1 }
      ]);
      const [wishlist, setWishlist] = useState(['prd_2', 'prd_8']);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isAiOpen, setIsAiOpen] = useState(false);

      // Search & Autocomplete
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [suggestions, setSuggestions] = useState([]);
      const [isSearchOpen, setIsSearchOpen] = useState(false);

      // Notification Toasts
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Language & Direction Sync
      const toggleLanguage = () => {
        const next = lang === 'fa' ? 'en' : 'fa';
        setLang(next);
        setDir(next === 'fa' ? 'rtl' : 'ltr');
        document.documentElement.setAttribute('dir', next === 'fa' ? 'rtl' : 'ltr');
        document.documentElement.setAttribute('lang', next);
      };

      // Fetch Initial Data
      const loadProducts = async () => {
        try {
          setLoading(true);
          const [resP, resC, resV] = await Promise.all([
            fetch('./api/products').then(r => r.json()),
            fetch('./api/categories').then(r => r.json()),
            fetch('./api/vendors').then(r => r.json())
          ]);
          setProducts(resP);
          setCategories(resC);
          setVendors(resV);
        } catch (e) {
          console.error("Error loading products:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadProducts();
      }, []);

      // Lucide Icon Auto-render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Autocomplete Fetcher
      useEffect(() => {
        if (!searchQuery.trim() || searchQuery.length < 2) {
          setSuggestions([]);
          setSearchResults([]);
          return;
        }

        const timer = setTimeout(async () => {
          try {
            const data = await fetch(`./api/search/autocomplete?q=${encodeURIComponent(searchQuery)}`).then(r => r.json());
            setSuggestions(data.suggestions || []);
            setSearchResults(data.products || []);
          } catch (e) {
            console.error(e);
          }
        }, 200);

        return () => clearTimeout(timer);
      }, [searchQuery]);

      // Cart Actions
      const addToCart = (productId, variantId = null) => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.productId === productId && item.variantId === variantId);
          if (idx >= 0) {
            const updated = [...prev];
            updated[idx].quantity += 1;
            return updated;
          }
          return [...prev, { productId, variantId, quantity: 1 }];
        });
        showToast(lang === 'fa' ? 'کالا با موفقیت به سبد خرید اضافه شد' : 'Item added to cart successfully');
        setIsCartOpen(true);
      };

      const toggleWishlist = (productId) => {
        setWishlist(prev => {
          const exists = prev.includes(productId);
          if (exists) {
            showToast(lang === 'fa' ? 'از لیست علاقه‌مندی‌ها حذف شد' : 'Removed from wishlist', 'info');
            return prev.filter(id => id !== productId);
          } else {
            showToast(lang === 'fa' ? 'به لیست علاقه‌مندی‌ها اضافه شد' : 'Added to wishlist');
            return [...prev, productId];
          }
        });
      };

      const totalCartCount = useMemo(() => cart.reduce((acc, item) => acc + item.quantity, 0), [cart]);

      return (
        <div className={`min-h-screen flex flex-col bg-[#05070d] text-slate-100 ${lang === 'fa' ? 'font-persian' : 'font-latin'}`} dir={dir}>
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 left-6 z-50 flex items-center gap-3 glass-panel px-5 py-3 rounded-xl border-brand-500/40 text-teal-300 shadow-2xl animate-bounce">
              <i data-lucide="check-circle" className="w-5 h-5 text-teal-400"></i>
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {/* TOP ANNOUNCEMENT BAR */}
          <div className="bg-gradient-to-r from-teal-950 via-slate-900 to-amber-950 text-slate-300 text-xs py-2 px-4 border-b border-slate-800 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <span className="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider">
                {lang === 'fa' ? 'جشنواره نوروز ۱۴۰۵' : 'NOROOZ FESTIVAL'}
              </span>
              <span className="hidden sm:inline text-slate-300">
                {lang === 'fa' ? 'ارسال رایگان اکسپرس سراسری با کد تخفیف: ' : 'Free Global Express Shipping with Code: '}
                <strong className="text-teal-400 font-mono">SHAHKAR2026</strong>
              </span>
            </div>

            <div className="flex items-center gap-4">
              {/* Language Switcher */}
              <button onClick={toggleLanguage} className="flex items-center gap-1.5 hover:text-teal-400 transition">
                <i data-lucide="globe" className="w-3.5 h-3.5"></i>
                <span>{lang === 'fa' ? 'English (LTR)' : 'فارسی (RTL)'}</span>
              </button>

              <span className="text-slate-700">|</span>

              {/* Currency Toggle */}
              <button onClick={() => setCurrency(c => c === 'TOMAN' ? 'USD' : 'TOMAN')} className="font-mono text-xs hover:text-amber-400 transition">
                {currency === 'TOMAN' ? 'تومان (IRR)' : 'USD ($)'}
              </button>

              <span className="text-slate-700">|</span>

              {/* Vendor Portal Quick Access */}
              <button onClick={() => setCurrentRoute('vendor-dashboard')} className="text-teal-400 hover:text-teal-300 font-medium flex items-center gap-1">
                <i data-lucide="store" className="w-3.5 h-3.5"></i>
                <span>{lang === 'fa' ? 'پنل فروشندگان' : 'Seller Hub'}</span>
              </button>
            </div>
          </div>

          {/* MAIN HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-6">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentRoute('home')}>
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-teal-500 via-amber-400 to-teal-300 p-[2px] shadow-lg shadow-teal-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                    <span className="text-xl font-black gold-gradient-text">شـ</span>
                  </div>
                </div>
                <div>
                  <h1 className="text-xl font-black tracking-tight text-white flex items-center gap-2">
                    {lang === 'fa' ? 'شاهـکــار' : 'SHAHKAR'}
                    <span className="text-[10px] bg-teal-500/20 text-teal-300 px-1.5 py-0.5 rounded border border-teal-500/30 font-mono">GLOBAL</span>
                  </h1>
                  <p className="text-[10px] text-slate-400 tracking-wider">
                    {lang === 'fa' ? 'اکوسیستم بازار جهانی هوشمند' : 'AI Multi-Vendor Ecosystem'}
                  </p>
                </div>
              </div>

              {/* Search Bar with Live Autocomplete Trigger */}
              <div className="flex-1 max-w-2xl relative hidden md:block">
                <div className="relative">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => {
                      setSearchQuery(e.target.value);
                      setIsSearchOpen(true);
                    }}
                    onFocus={() => setIsSearchOpen(true)}
                    placeholder={lang === 'fa' ? 'جستجوی هوشمند در میلیون‌ها کالای فاخر و فروشندگان برتر...' : 'Search millions of verified products, brands and artisan stores...'}
                    className="w-full bg-slate-900/90 border border-slate-700/60 rounded-2xl py-2.5 px-10 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-400/20 transition-all shadow-inner"
                  />
                  <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute right-3.5 top-3"></i>
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute left-3 top-3 text-slate-500 hover:text-slate-300">
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  )}
                </div>

                {/* Autocomplete Dropdown */}
                {isSearchOpen && (suggestions.length > 0 || searchResults.length > 0) && (
                  <div className="absolute top-12 right-0 left-0 glass-panel rounded-2xl p-4 shadow-2xl border border-slate-700 z-50 mt-1 max-h-96 overflow-y-auto">
                    {suggestions.length > 0 && (
                      <div className="mb-3">
                        <span className="text-[11px] text-slate-400 font-bold block mb-2">{lang === 'fa' ? 'کلیدواژه‌های پیشنهادی:' : 'Suggested Keywords:'}</span>
                        <div className="flex flex-wrap gap-2">
                          {suggestions.map((s, idx) => (
                            <button
                              key={idx}
                              onClick={() => {
                                setSearchQuery(s);
                                setCurrentRoute('catalog');
                              }}
                              className="bg-slate-800/80 hover:bg-teal-500/20 hover:text-teal-300 border border-slate-700 text-xs px-3 py-1 rounded-full transition"
                            >
                              {s}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {searchResults.length > 0 && (
                      <div>
                        <span className="text-[11px] text-slate-400 font-bold block mb-2">{lang === 'fa' ? 'محصولات مرتبط:' : 'Matching Products:'}</span>
                        <div className="space-y-2">
                          {searchResults.map(p => (
                            <div
                              key={p.id}
                              onClick={() => {
                                setSelectedProductId(p.id);
                                setCurrentRoute('product-detail');
                                setIsSearchOpen(false);
                              }}
                              className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-800/60 cursor-pointer transition"
                            >
                              <div className="flex items-center gap-3">
                                <img src={p.images?.[0] || ''} alt={p.title_fa} className="w-10 h-10 object-cover rounded-lg" />
                                <div>
                                  <h4 className="text-xs font-semibold text-slate-200">{lang === 'fa' ? p.title_fa : p.title_en}</h4>
                                  <span className="text-[10px] text-amber-400 font-mono">{formatTomans(p.final_price_tomans, lang)}</span>
                                </div>
                              </div>
                              <i data-lucide="chevron-left" className="w-4 h-4 text-slate-500"></i>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Action Navigation Buttons */}

    // --- AI ASSISTANT DRAWER COMPONENT WITH QUICK ACTION PROMPTS ---
    const AIAssistantDrawer = ({ lang, onClose, onSelectProduct }) => {
      const [messages, setMessages] = useState([
        { sender: 'ai', text: lang === 'fa' ? 'درود! من دستیار هوشمند خریدهای فاخر «شاهکار» هستم. چطور می‌توانم راهنماییتان کنم؟' : 'Greetings! How can I assist your shopping today?' }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);

      const quickPrompts = [
        'راهنمایی خرید ساعت لوکس',
        'بهترین هدفون هوشمند',
        'خاویار امپریال و زعفران',
        'فرش ابریشم قم'
      ];

      const handleSend = async (queryText = null) => {
        const textToSend = queryText || input;
        if (!textToSend.trim()) return;
        
        setInput('');
        setMessages(prev => [...prev, { sender: 'user', text: textToSend }]);
        setIsTyping(true);

        try {
          const res = await fetch('./api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: textToSend, lang })
          }).then(r => r.json());

          setMessages(prev => [...prev, { sender: 'ai', text: res.reply, products: res.suggestedProducts }]);
        } catch (e) {
          console.error(e);
        } finally {
          setIsTyping(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex justify-start bg-slate-950/80 backdrop-blur-sm">
          <div className="w-full max-w-lg bg-slate-900 border-l border-slate-800 h-full p-6 flex flex-col justify-between shadow-2xl">
            <div>
              <div className="flex justify-between items-center pb-4 border-b border-slate-800">

                  <i data-lucide="sparkles" className="w-5 h-5 text-amber-400"></i>
                  <h3 className="text-base font-bold text-white">{lang === 'fa' ? 'دستیار هوش مصنوعی شاهکار' : 'Shahkar AI Shopping Advisor'}</h3>
                </div>
                <button onClick={onClose} className="text-slate-400 hover:text-white">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              {/* Quick Action Prompt Pills */}
              <div className="flex flex-wrap gap-1.5 mt-4">
                {quickPrompts.map((qp, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSend(qp)}
                    className="bg-slate-800 hover:bg-teal-500/20 hover:text-teal-300 border border-slate-700 text-[11px] px-2.5 py-1 rounded-full text-slate-300 transition"
                  >
                    {qp}
                  </button>
                ))}
              </div>

              <div className="space-y-4 mt-4 overflow-y-auto max-h-[55vh] p-2">
                {messages.map((m, idx) => (
                  <div key={idx} className={`p-4 rounded-2xl text-xs leading-relaxed ${
                    m.sender === 'user' ? 'bg-teal-500/20 border border-teal-500/30 text-teal-200 ml-8' : 'bg-slate-950/80 border border-slate-800 text-slate-200 mr-8'
                  }`}>
                    {m.text}

                    {m.products && m.products.length > 0 && (
                      <div className="mt-3 space-y-2 border-t border-slate-800 pt-3">
                        {m.products.map(p => (
                          <div
                            key={p.id}
                            onClick={() => onSelectProduct(p.id)}
                            className="flex items-center gap-3 p-2 bg-slate-900 rounded-xl cursor-pointer hover:border-teal-400 border border-slate-800"
                          >
                            <img src={p.images?.[0] || ''} alt="p" className="w-10 h-10 object-cover rounded-lg" />
                            <div>
                              <strong className="block text-white line-clamp-1">{p.title_fa}</strong>
                              <span className="text-amber-400 font-mono">{formatTomans(p.final_price_tomans, lang)}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
                {isTyping && <div className="text-xs text-teal-400 animate-pulse">شاهکار AI در حال تحلیل بازار...</div>}
              </div>
            </div>

            <div className="pt-4 border-t border-slate-800 flex gap-2">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                placeholder={lang === 'fa' ? 'مثال: یک هدفون نویزکنسلینگ با شارژ بالا پیشنهاد بده...' : 'Ask AI anything...'}
                className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none"
              />
              <button onClick={() => handleSend()} className="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-4 rounded-xl transition">
                ارسال
              </button>
            </div>
          </div>
        </div>
      );
    };

    // Render Root
    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
