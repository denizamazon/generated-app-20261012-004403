    const formatTomans = (num, lang = 'fa') => {
      if (!num) return (lang === 'fa' || lang === 'ur' || lang === 'ar') ? '۰ تومان' : '$0 USD';
      if (lang === 'en' || lang === 'tr') {
        const usdVal = (num / 600000).toFixed(1);
        const formatted = num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return `$${usdVal} USD (${formatted} Tomans)`;
      }
      const formatted = num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, "٫");
      if (lang === 'fa' || lang === 'ur') {
        const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
        const faNum = formatted.replace(/[0-9]/g, w => persianDigits[parseInt(w)]);
        return `${faNum} تومان`;
      }
      if (lang === 'ar') {
        const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
        const arNum = formatted.replace(/[0-9]/g, w => arabicDigits[parseInt(w)]);
        return `${arNum} تومان`;
      }
      return `${formatted} Tomans`;
    };

      // Calculate Cart

          const res = await fetch('/api/cart/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: cartItems, couponCode })
          });
          const data = await res.json();
          setCartCalculated(data);

        calculateCart();

      const addToCart = (product, variantId = null) => {
        setCartItems(prev => {
          const existing = prev.find(item => item.productId === product.id && item.variantId === (variantId || `${product.id}_v1`));
          if (existing) {
            return prev.map(item => item.productId === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { productId: product.id, variantId: variantId || `${product.id}_v1`, quantity: 1 }];
        });
        showToast(`کالای «${product.title_fa}» به سبد خرید شما اضافه گردید.`);
      };

      const updateQuantity = (productId, delta) => {
        setCartItems(prev => prev.map(item => {
          if (item.productId === productId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

            postal_code: checkoutForm.postalCode,
            recipient_name: checkoutForm.recipientName,
            phone: checkoutForm.phone

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userId: 'usr_customer1',
              items: cartItems,
              shippingAddress,
              paymentMethod: checkoutForm.paymentMethod,
              couponCode
            })
          });

          const data = await res.json();

          if (data.success && data.order) {
            if (window.confetti) window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
            setLatestOrder(data.order);
            setOrdersList(prev => [data.order, ...prev]);
            setCartItems([]);

            setIsCartOpen(false);
            showToast('پرداخت با موفقیت انجام شد و سفارش ثبت گردید!');

        try {

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg, lang })
          });
          const data = await res.json();
          setAiMessages(prev => [...prev, { sender: 'bot', text: data.reply, products: data.suggestedProducts }]);
        } catch (e) {
          setAiMessages(prev => [...prev, { sender: 'bot', text: 'پاسخگویی هوشمند با مشکل مواجه گردید. لطفاً مجدداً تلاش کنید.' }]);
        }

                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3">
                  {cartItems.length === 0 ? (
                    <div className="text-center py-12 text-slate-500 text-xs">سبد خرید شما خالی است.</div>
                  ) : (
                    cartItems.map((item, idx) => {
                      const p = products.find(prod => prod.id === item.productId);
                      if (!p) return null;
                      return (
                        <div key={idx} className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                          <div className="flex items-center gap-3">
                            <img src={p.images[0]} alt="" className="w-10 h-10 rounded-lg object-cover" />
                            <div>
                              <h4 className="font-bold text-white line-clamp-1">{p.title_fa}</h4>
                              <span className="text-alibaba-400 font-bold">{formatTomans(p.final_price_tomans, lang)}</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQuantity(p.id, -1)} className="p-1 rounded bg-slate-800 text-white">-</button>
                            <span className="font-bold">{item.quantity}</span>
                            <button onClick={() => updateQuantity(p.id, 1)} className="p-1 rounded bg-slate-800 text-white">+</button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {cartCalculated && (
                  <div className="pt-4 border-t border-slate-800 space-y-2 text-xs font-bold">
                    <div className="flex justify-between text-slate-400">
                      <span>جمع کالاها:</span>
                      <span>{formatTomans(cartCalculated.subtotalTomans, lang)}</span>
                    </div>
                    <div className="flex justify-between text-emerald-400">
                      <span>تخفیف:</span>
                      <span>{formatTomans(cartCalculated.itemDiscountTomans, lang)}</span>
                    </div>
                    <div className="flex justify-between text-amber-400">
                      <span>مالیات (۱۰٪):</span>
                      <span>{formatTomans(cartCalculated.vatTaxTomans, lang)}</span>
                    </div>
                    <div className="flex justify-between text-white text-sm font-black pt-2 border-t border-slate-800">
                      <span>مبلغ قابل پرداخت:</span>
                      <span className="text-alibaba-400">{formatTomans(cartCalculated.grandTotalTomans, lang)}</span>
                    </div>

                    <button
                      onClick={() => { setIsCartOpen(false); setIsCheckoutModalOpen(true); }}
                      className="w-full btn-alibaba font-black text-xs py-3 rounded-xl shadow-lg mt-2"
                    >
                      ادامه به تسویه‌حساب
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {isCheckoutModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4 animate-fade-in overflow-y-auto">
              <div className="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-700 max-w-xl w-full space-y-5 shadow-2xl relative my-8">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-black text-white">تکمیل سفارش و درگاه پرداخت ایمن</h3>
                  <button onClick={() => setIsCheckoutModalOpen(false)} className="p-2 rounded-xl bg-slate-950 text-slate-400 border border-slate-800">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="text-slate-300 font-bold block mb-1">نام و نام خانوادگی گیرنده:</label>
                    <input
                      type="text"
                      value={checkoutForm.recipientName}
                      onChange={(e) => setCheckoutForm({ ...checkoutForm, recipientName: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 font-bold block mb-1">نشانی تحویل پستی در {selectedProvince} - {selectedCity}:</label>
                    <input
                      type="text"
                      value={checkoutForm.address}
                      onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 font-bold block mb-1">شماره همراه گیرنده:</label>
                    <input
                      type="text"
                      value={checkoutForm.phone}
                      onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"
                    />
                  </div>

                  {cartCalculated && (
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1 font-bold">
                      <div className="flex justify-between text-slate-400">
                        <span>مبلغ کالا:</span>
                        <span>{formatTomans(cartCalculated.subtotalTomans - cartCalculated.itemDiscountTomans, lang)}</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>حمل اکسپرس:</span>
                        <span>{formatTomans(65000, lang)}</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>مالیات (۱۰٪):</span>
                        <span>{formatTomans(cartCalculated.vatTaxTomans, lang)}</span>
                      </div>
                      <div className="flex justify-between text-white text-sm font-black pt-2 border-t border-slate-800">
                        <span>مبلغ نهایی:</span>
                        <span className="text-alibaba-400">{formatTomans(cartCalculated.grandTotalTomans, lang)}</span>
                      </div>
                    </div>
                  )}

                  <button
                    onClick={handleCheckoutSubmit}
                    className="w-full btn-alibaba font-black text-xs py-3.5 rounded-xl shadow-xl"
                  >
                    پرداخت نهایی و ثبت سفارش
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PRODUCT DETAIL MODAL */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in overflow-y-auto">
              <div className="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-700 max-w-3xl w-full space-y-6 shadow-2xl relative my-8">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <h3 className="text-base font-black text-white">{getLocalizedText(selectedProduct, 'title', lang)}</h3>
                  <button onClick={() => setSelectedProduct(null)} className="p-2 rounded-xl bg-slate-950 text-slate-400 hover:text-white border border-slate-800">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <ProductImageGallery 
                    images={selectedProduct.images} 
                    title={getLocalizedText(selectedProduct, 'title', lang)} 
                    discountPercent={selectedProduct.discount_percent}
                    storeBadge={selectedProduct.vendor_badge}
                  />

                  <div className="space-y-4 text-xs">
                    <div>
                      <span className="text-amber-400 font-bold block mb-1">غرفه: {selectedProduct.store_name}</span>
                      <p className="text-slate-300 leading-relaxed">{getLocalizedText(selectedProduct, 'description', lang)}</p>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-slate-400">قیمت اصلی:</span>
                        <span className="line-through text-slate-500">{formatTomans(selectedProduct.base_price_tomans, lang)}</span>
                      </div>
                      <div className="flex justify-between items-center">
                        <span className="text-white font-bold">قیمت با تخفیف ویژه:</span>
                        <span className="text-base font-black text-alibaba-400">{formatTomans(selectedProduct.final_price_tomans, lang)}</span>
                      </div>
                    </div>

                    <button
                      onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }}
                      className="w-full btn-alibaba font-black text-xs py-3 rounded-xl"
                    >
                      افزودن به سبد خرید
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODALS */}
          <LanguageModal
            isOpen={isLangModalOpen}
            onClose={() => setIsLangModalOpen(false)}
            currentLang={lang}
            onSelectLang={setLang}
          />

          <LocationModal
            isOpen={isLocationModalOpen}
            onClose={() => setIsLocationModalOpen(false)}
            selectedProvince={selectedProvince}
            setSelectedProvince={setSelectedProvince}
            selectedCity={selectedCity}
            setSelectedCity={setSelectedCity}
            lang={lang}
          />

          <ReaddyStudioModal
            isOpen={isStudioModalOpen}
            onClose={() => setIsStudioModalOpen(false)}
            lang={lang}
            showToast={showToast}
            onProductGenerated={(newProd) => setProducts(prev => [newProd, ...prev])}
            activeTheme={activeTheme}
            setActiveTheme={setActiveTheme}
          />

          <HamburgerDrawerMenu
            isOpen={isMenuOpen}
            onClose={() => setIsMenuOpen(false)}
            lang={lang}
            themeMode={themeMode}
            onToggleTheme={() => setThemeMode(prev => prev === 'dark' ? 'light' : 'dark')}
            currency={currency}
            onToggleCurrency={() => setCurrency(prev => prev === 'TOMAN' ? 'USD' : 'TOMAN')}
            currentRoute={currentRoute}
            onNavigate={setCurrentRoute}
            user={user}
            onOpenAuth={() => setIsAuthOpen(true)}
            onOpenAi={() => setIsAiModalOpen(true)}
            selectedProvince={selectedProvince}
            selectedCity={selectedCity}
            onOpenLocationModal={() => setIsLocationModalOpen(true)}
          />

        </div>
      );
    };

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
